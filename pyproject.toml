[project]
name = "acie"
version = "0.1.0"
description = "Agent Code Intelligence Engine — a standalone, deterministic, repository-aware code-intelligence MCP server for AI coding agents."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.1.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[project.scripts]
acie = "acie.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
