[project]
name = "acie"
version = "0.1.0"
description = "Agent Code Intelligence Engine — a standalone, deterministic, repository-aware code-intelligence MCP server for AI coding agents."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.1.1",
    # 0.26.0 has an unfixed Point.row/Point.column reference-counting bug
    # (borrowed ref returned instead of a new one for non-immortal ints,
    # i.e. line/column numbers >256) that silently corrupts the pymalloc
    # free list and causes a deferred SIGSEGV -- see
    # https://github.com/tree-sitter/py-tree-sitter/pull/466 and
    # https://github.com/tree-sitter/py-tree-sitter/issues/472. Fixed on
    # py-tree-sitter's master but not yet in a tagged release; pin below
    # 0.26.0 until a release containing that fix exists, then re-open.
    "tree-sitter>=0.25.0,<0.26.0",
    "tree-sitter-python>=0.25.0",
    "pathspec>=0.12.0",
    "watchdog>=4.0.0",
    # shortcut: no minimum basedpyright version verified against this integration;
    # add a floor if a real incompatibility with an old install surfaces.
    "basedpyright",
]

[project.scripts]
acie = "acie.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
